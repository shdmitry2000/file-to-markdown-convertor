[project]
name = "file-to-markdown-convertor"
version = "0.1.0"
description = "Centralized PDF to Markdown conversion service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "uvicorn>=0.40.0",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyzmq>=26.0.0",
    "docling>=2.105.0",
    "docling-core>=2.75.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.34.0,<1.0",
    "pymupdf4llm>=0.0.0",
    "markitdown[all]>=0.0.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "python-frontmatter>=1.0.0",
    "python-multipart>=0.0.22",
    # VLM_BACKEND=factory routes vision through shared.llm_factory -> litellm ->
    # Vertex. Needed by the dbank Hebrew pipeline and docling's VLM fallback;
    # without them `import shared.llm_factory` fails and both converters are
    # unavailable. Pin matches evaluator/requirements.txt so the platform runs
    # one litellm across services.
    "litellm>=1.84.0,<2.0.0",
    "google-auth>=2.56.0",
    "google-cloud-aiplatform>=1.163.0",
]

[tool.uv]
index-url = "https://pypi.org/simple"
index-strategy = "unsafe-best-match"
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"


[tool.uv.sources]
torch = { index = "pytorch-cpu" }


[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
