[project]
name = "file-to-markdown-convertor"
version = "0.1.0"
description = "Centralized PDF to Markdown conversion service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "uvicorn>=0.40.0",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyzmq>=26.0.0",
    "docling>=2.105.0",
    "docling-core>=2.75.0",
    "transformers>=4.40.0",
    "huggingface-hub>=1.3.0",
    "pymupdf4llm>=0.0.0",
    "markitdown[all]>=0.0.0",
    "httpx>=0.27.0",
    "pillow>=12.3.0",
    "python-frontmatter>=1.0.0",
    "python-multipart>=0.0.31",
    # VLM_BACKEND=factory routes vision through shared.llm_factory -> litellm ->
    # Vertex. Needed by the dbank Hebrew pipeline and docling's VLM fallback;
    # without them `import shared.llm_factory` fails and both converters are
    # unavailable. Pin matches evaluator/requirements.txt so the platform runs
    # one litellm across services.
    "litellm>=1.84.0,<2.0.0",
    "google-auth>=2.56.0",
    "google-cloud-aiplatform>=1.163.0",
]

[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "urllib3>=2.7.0",
    "pyjwt>=2.13.0",
    "soupsieve>=2.8.4",
    "lxml>=6.1.0",
    "idna>=3.15",
    "requests>=2.33.0",
    "pillow>=12.3.0",
    "setuptools>=83.0.0",
    "click>=8.3.3",
    "pygments>=2.20.0",
    "torch>=2.13.0",
    "transformers>=5.3.0",
    "litellm>=1.84.0",
]
index-url = "https://pypi.org/simple"
index-strategy = "unsafe-best-match"
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"


[tool.uv.sources]
torch = { index = "pytorch-cpu" }


[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
