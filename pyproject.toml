[project]
name = "file-to-markdown-convertor"
version = "1.4.8"
description = "Centralized PDF to Markdown conversion service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "uvicorn>=0.40.0",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyzmq>=26.0.0",
    "docling>=2.142.1",
    "docling-core>=2.104.0",
    "transformers>=4.40.0",
    "huggingface-hub>=1.3.0",
    "pymupdf4llm>=0.0.0",
    "markitdown[all]>=0.0.0",
    # Direct dependency of the formula-aware excel converter. It also arrives
    # transitively via markitdown[all], but that is not a contract we control.
    "openpyxl>=3.1",
    # Legacy .xls for the same converter (openpyxl cannot read it). Also pulled in
    # by markitdown[all], which must not decide whether .xls works.
    "xlrd>=2.0.1",
    "httpx>=0.27.0",
    "pillow>=12.3.0",
    "python-frontmatter>=1.0.0",
    "python-multipart>=0.0.31",
    # VLM_BACKEND=factory routes vision through shared.llm_factory -> litellm ->
    # Vertex. Needed by the dbank Hebrew pipeline and docling's VLM fallback;
    # without them `import shared.llm_factory` fails and both converters are
    # unavailable. Pin matches evaluator/requirements.txt so the platform runs
    # one litellm across services.
    "litellm>=1.84.0,<2.0.0",
    "google-auth>=2.56.0",
    "google-cloud-aiplatform>=1.163.0",
]

[tool.uv]
# Xray (1.4.4.1): fixed versions sit above upstream caps -- docling pins
# pillow<13 and litellm pins filelock<4 -- so they are overridden, not constrained.
override-dependencies = [
    "pillow>=13.0.0",
    "filelock>=4.2.1",
]
constraint-dependencies = [
    "aiohttp>=3.14.4",
    "cryptography>=50.0.0",
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "urllib3>=2.8.0",
    "pyjwt>=2.15.0",
    "soupsieve>=2.8.4",
    "lxml>=6.1.0",
    "idna>=3.15",
    "requests>=2.33.0",
    "pillow>=12.3.0",
    "setuptools>=84.1.0",
    "click>=8.3.3",
    "pygments>=2.20.0",
    "torch>=2.13.0",
    "transformers>=5.10.0",
    "litellm>=1.104.0",
    "fsspec>=2026.6.0",
    "multidict>=6.9.1",
    "anyio>=4.14.2",
    # The Dockerfile swaps in opencv-python-headless at this exact version. 4.14 bundles
    # ffmpeg 8.1.2; 5.0.0.93 bundles the older 8.1.1 (see .grype.yaml in rag_bank).
    "opencv-python>=4.14.0.94,<5",
]
index-url = "https://pypi.org/simple"
index-strategy = "unsafe-best-match"
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"


[tool.uv.sources]
torch = { index = "pytorch-cpu" }


[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-timeout>=2.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A hung conversion must fail its test, not stall the run: the warm-worker and
# timeout tests spawn children that a regression can leave waiting forever.
timeout = 180
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Tests that run the real docling pipeline and download models. Deselected by
# default so the suite stays offline and fast; run them with `pytest -m integration`.
markers = [
    "integration: real converter/model run; needs models and a network",
]
addopts = "-m 'not integration'"
